version: '3.8'

services:
  plex-api:
    image: plex-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plex-api
    ports:
      - '5000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  plex-worker:
    image: plex-worker:latest
    build:
      context: .
      dockerfile: src/Plex.Worker/Dockerfile
    container_name: plex-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
    depends_on:
      plex-api:
        condition: service_healthy
    restart: unless-stopped
